min_version: 2.0.0

output:
  - summary
  - failure

ci:
  commands:
    prettier_check:
      run: make format-check
    js_syntax:
      run: make js-syntax
    compiler_sanity:
      run: make sanity-check WEBSITE_COMPILER_CLI="${WEBSITE_COMPILER_CLI:-./website-compiler/cmd/website-compiler}"
    compiler_site_data:
      run: make site-data-check WEBSITE_COMPILER_CLI="${WEBSITE_COMPILER_CLI:-./website-compiler/cmd/website-compiler}"
    compiler_asset_usage:
      run: make asset-usage-check WEBSITE_COMPILER_CLI="${WEBSITE_COMPILER_CLI:-./website-compiler/cmd/website-compiler}"
    compiler_template_pages:
      run: make template-compile-check WEBSITE_COMPILER="${WEBSITE_COMPILER:-./website-compiler/cmd/build-static}"
    build_static:
      run: make build-static-check WEBSITE_COMPILER="${WEBSITE_COMPILER:-./website-compiler/cmd/build-static}"
    build_inline:
      run: make build-inline-check WEBSITE_COMPILER="${WEBSITE_COMPILER:-./website-compiler/cmd/build-static}"


    agents-drift-hint:
      run: |
        changed=$(git diff --cached --name-only 2>/dev/null)
        if echo "$changed" | grep -qE '\.(go|py|rs|tf)$' && \
           ! echo "$changed" | grep -q 'AGENTS\.md'; then
          echo "hint: source files changed — check if AGENTS.md needs updating" >&2
        fi
        exit 0
