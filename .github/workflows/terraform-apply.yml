name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "envs/**"
      - ".github/workflows/terraform-apply.yml"

concurrency:
  group: terraform-apply-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # Request OIDC JWT
  contents: read
  deployments: write

jobs:
  # Determine which environments need updates based on changed files
  detect-changes:
    timeout-minutes: 15
    if: vars.TERRAFORM_APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      prod: ${{ steps.changes.outputs.prod }}
      staging: ${{ steps.changes.outputs.staging }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect changed environments
        id: changes
        run: |
          diff_range="${{ github.event.before }}..${{ github.sha }}"
          git diff --name-only "$diff_range" | grep -q "^envs/prod/" && echo "prod=true" >> "$GITHUB_OUTPUT" || echo "prod=false" >> "$GITHUB_OUTPUT"
          git diff --name-only "$diff_range" | grep -q "^envs/staging/" && echo "staging=true" >> "$GITHUB_OUTPUT" || echo "staging=false" >> "$GITHUB_OUTPUT"
          # Also deploy if shared infra changed
          git diff --name-only "$diff_range" | grep -q "^infra/stack/" && {
            echo "prod=true" >> "$GITHUB_OUTPUT"
            echo "staging=true" >> "$GITHUB_OUTPUT"
          }

  apply-staging:
    needs: detect-changes
    if: vars.TERRAFORM_APPLY_ENABLED == 'true' && needs.detect-changes.outputs.staging == 'true'
    uses: FelipeFuhr/ffreis-workflows-terraform/.github/workflows/tf-apply.yml@e0cd54322d52fe7c522dd0bc2c46d56df2ceae43
    with:
      environment: "staging"
      chdir: "infra/stack"
    secrets: inherit

  apply-prod:
    needs: [detect-changes, apply-staging]
    if: vars.TERRAFORM_APPLY_ENABLED == 'true' && needs.detect-changes.outputs.prod == 'true'
    uses: FelipeFuhr/ffreis-workflows-terraform/.github/workflows/tf-apply.yml@e0cd54322d52fe7c522dd0bc2c46d56df2ceae43
    with:
      environment: "prod"
      chdir: "infra/stack"
    secrets: inherit
