name: DevOps / Terraform Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.tf"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "**/*.tf"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    permissions:
      contents: read
    uses: ffreis-org/ffreis-workflows-terraform/.github/workflows/tf-fmt.yml@e0cd54322d52fe7c522dd0bc2c46d56df2ceae43
    with:
      working-directory: "."

  validate:
    needs: [fmt]
    permissions:
      contents: read
    uses: ffreis-org/ffreis-workflows-terraform/.github/workflows/tf-validate.yml@e0cd54322d52fe7c522dd0bc2c46d56df2ceae43
    with:
      chdir: "infra/stack"
      validate-all-modules: true
      modules-dir: "infra/modules"

  lint:
    needs: [fmt]
    permissions:
      contents: read
    uses: ffreis-org/ffreis-workflows-terraform/.github/workflows/tf-lint.yml@e0cd54322d52fe7c522dd0bc2c46d56df2ceae43
    with:
      lint-path: "."

  trivy-config:
    needs: [fmt]
    permissions:
      contents: read
      security-events: write
    uses: ffreis-org/ffreis-workflows-terraform/.github/workflows/tf-security.yml@e0cd54322d52fe7c522dd0bc2c46d56df2ceae43
    with:
      scan-ref: "."

  tfsec:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    needs: [fmt]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: "."
          additional_args: "--minimum-severity HIGH"
          github_token: ${{ github.token }}

  checkov:
    needs: [fmt]
    permissions:
      contents: read
      security-events: write
    uses: ffreis-org/ffreis-workflows-terraform/.github/workflows/tf-checkov.yml@e0cd54322d52fe7c522dd0bc2c46d56df2ceae43
    with:
      scan-directory: "."
      framework: "terraform"
      soft-fail: false

  semgrep:
    needs: [fmt]
    permissions:
      contents: read
      security-events: write
    uses: ffreis-org/ffreis-workflows-terraform/.github/workflows/tf-semgrep.yml@e0cd54322d52fe7c522dd0bc2c46d56df2ceae43
    with:
      working-directory: "."
      config: "p/terraform"
