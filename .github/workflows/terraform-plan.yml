name: Terraform Plan & Validate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "infra/**"
      - "envs/**"
      - ".github/workflows/terraform-plan.yml"

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # Request OIDC JWT
  contents: read
  pull-requests: write

jobs:
  plan-dev:
    if: vars.TERRAFORM_PLAN_ENABLED != 'false'
    uses: FelipeFuhr/ffreis-workflows-terraform/.github/workflows/tf-plan.yml@e0cd54322d52fe7c522dd0bc2c46d56df2ceae43
    with:
      environment: "dev"
      chdir: "infra/stack"
    secrets: inherit

  plan-staging:
    if: vars.TERRAFORM_PLAN_ENABLED != 'false'
    uses: FelipeFuhr/ffreis-workflows-terraform/.github/workflows/tf-plan.yml@e0cd54322d52fe7c522dd0bc2c46d56df2ceae43
    with:
      environment: "staging"
      chdir: "infra/stack"
    secrets: inherit

  plan-prod:
    if: vars.TERRAFORM_PLAN_ENABLED != 'false'
    uses: FelipeFuhr/ffreis-workflows-terraform/.github/workflows/tf-plan.yml@e0cd54322d52fe7c522dd0bc2c46d56df2ceae43
    with:
      environment: "prod"
      chdir: "infra/stack"
    secrets: inherit
