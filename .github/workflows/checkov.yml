name: Checkov (compliance)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "infra/**"
      - "envs/**"
      - ".github/workflows/checkov.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checkov:
    uses: FelipeFuhr/ffreis-workflows-terraform/.github/workflows/tf-checkov.yml@v1.0.0
    with:
      scan-directory: "infra/"
